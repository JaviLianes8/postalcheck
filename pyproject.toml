[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "postalcheck"
version = "1.0.0"
description = "Validate and normalize postal code formats for 182 countries and territories, with no runtime dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["postal", "postcode", "postal-code", "zip", "zip-code", "eircode", "address", "validation", "normalization", "libaddressinput", "country", "iso3166"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/postalcheck"
Source = "https://github.com/JaviLianes8/postalcheck"
Issues = "https://github.com/JaviLianes8/postalcheck/issues"
Changelog = "https://github.com/JaviLianes8/postalcheck/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[project.scripts]
postalcheck = "postalcheck._cli:main"

[tool.hatch.build.targets.sdist]
# Third-party test files are fetched locally and never shipped; only their manifest is.
include = [
    "src/postalcheck",
    "tests/*.py",
    "tests/upstream/MANIFEST.json",
    "scripts/fetch_upstream.py",
    "CHANGELOG.md",
    "README.md",
    "GUIDE.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/postalcheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
timeout = 300
